name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # the demo data is generated at BUILD time against DateTime.now(), so a repo
  # that sits still for a week publishes a demo that looks abandoned: "last
  # check 6 days ago", every automation badged quiet, every trend negative.
  # rebuilding nightly is what keeps the sales asset current. 09:00 UTC is
  # ~03:00 mountain — well clear of a working day.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # baked into the bundle at build time. both are browser-safe: row level security
          # is what constrains the anon key. the service-role key is never here — it lives
          # only in the ingest edge function's secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
